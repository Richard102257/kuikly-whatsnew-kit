# ─── Gradle 配置 ───
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# ─── 版本信息 ───
VERSION=1.3.0
GROUP=io.github.Richard102257

# ─── Maven 发布凭据（发布时配置） ───
# mavenUsername=your-sonatype-username
# mavenPassword=your-sonatype-password

# ─── GPG 签名（发布时配置） ───
# signing.keyId=YOUR_KEY_ID
# signing.password=YOUR_KEY_PASSWORD
# signing.secretKeyRingFile=/path/to/secring.gpg

# ─── Kuikly 版本 ───
kuiklyVersion=2.4.0-2.0.21

# ─── Kotlin/Native 编译器从 Maven Central 下载（比 download.jetbrains.com 快）───
kotlin.native.distribution.downloadFromMaven=true
