jdk:
  - openjdk17

before_install:
  - sdk install java 17.0.9-zulu
  - sdk use java 17.0.9-zulu
  - rm -rf gradle/wrapper gradlew
  - curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew
  - chmod +x gradlew
  - mkdir -p gradle/wrapper
  - curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
  - printf 'distributionBase=GRADLE_USER_HOME\\ndistributionPath=wrapper/dists\\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip\\nnetworkTimeout=10000\\nvalidateDistributionUrl=true\\nzipStoreBase=GRADLE_USER_HOME\\nzipStorePath=wrapper/dists' > gradle/wrapper/gradle-wrapper.properties

install:
  - ./gradlew build publishToMavenLocal -x test --no-daemon
