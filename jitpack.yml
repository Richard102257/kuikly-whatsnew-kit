# JitPack configuration for Kuikly WhatsNewKit
# https://jitpack.io/docs/

jdk:
  - openjdk17

before_install:
  - sdk install java 17.0.9-zulu
  - sdk use java 17.0.9-zulu

# Kuikly requires Android SDK
android:
  accept-license: true

# Build and publish all library modules
build:
  - ./gradlew :whatsnew:publishToMavenLocal
  - ./gradlew :whatsnewAndroid:publishToMavenLocal
  - ./gradlew :whatsnewOhos:publishToMavenLocal
